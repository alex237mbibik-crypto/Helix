# Скопируйте файл как config.yaml и подставьте свои таблицы.
# ID таблицы — кусок ссылки между /d/ и /edit:
# https://docs.google.com/spreadsheets/d/ВОТ_ЭТОТ_ID/edit
#
# sources — откуда читать данные
# destinations — куда писать новые строки и копировать записи
# service / address — необязательно: одна таблица на тип услуги и адрес.
# sheet: один лист, несколько через запятую, или все — тогда читаются все вкладки файла
#   sheet: все
#   sheet: Лист1, Заказы
# kind: info — общая информация под календарём записи (не смешивается с записями)
# Вкладки с именами Информация, Прайс, Контакты при sheet: все тоже идут вниз.

credentials: credentials.json

sources:
  - name: Клиника
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: все
    # service: Стрижка
    # address: ул. Ленина

  - name: Клиника 2
    spreadsheet_id: PASTE_ANOTHER_ID_OR_URL
    sheet: Лист1, Заказы

  - name: Справка клиники
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: Информация
    kind: info

destinations:
  - name: Назначение
    spreadsheet_id: PASTE_DESTINATION_ID_OR_URL
    sheet: Лист1
    service: Стрижка
    address: ул. Ленина

  - name: Назначение
    spreadsheet_id: PASTE_ANOTHER_DESTINATION_ID_OR_URL
    sheet: Лист1
    service: Диагностика
    address: ул. Мира
