# credentials.json — JSON сервисного аккаунта (локально на каждом ПК).
#
# registry — ОДНА служебная Google-таблица на всю клинику (не календарь!).
# В ней программа хранит общий список рабочих таблиц для всех компьютеров.
# Откройте её для client_email сервисного аккаунта как Редактор.
# Лист SheetsHub создаётся сам при первом сохранении.
#
# sources ниже — необязательный локальный кэш; после настройки registry
# список всегда берётся из облака.

credentials: credentials.json

registry:
  spreadsheet_id: PASTE_REGISTRY_SPREADSHEET_ID_OR_URL
  sheet: SheetsHub

sources: []

destinations: []

# Уведомления в Telegram при записи клиента в календаре (для тестов).
# 1) Создайте бота через @BotFather, скопируйте token.
# 2) Напишите боту любое сообщение в Telegram.
# 3) Откройте https://api.telegram.org/bot<TOKEN>/getUpdates — найдите chat.id.
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
