# credentials.json — JSON сервисного аккаунта (локально на каждом ПК).
#
# registry — ОДНА служебная Google-таблица на всю клинику (не календарь!).
# В ней программа хранит общий список рабочих таблиц для всех компьютеров.
# Откройте её для client_email сервисного аккаунта как Редактор.
# Лист SheetsHub создаётся сам при первом сохранении.
#
# sources ниже — необязательный локальный кэш; после настройки registry
# список всегда берётся из облака.

credentials: credentials.json

registry:
  spreadsheet_id: PASTE_REGISTRY_SPREADSHEET_ID_OR_URL
  sheet: SheetsHub

sources: []

# В каждой таблице заполняйте name / service / city / address —
# по ним работает фильтр Услуга → Город → Адрес в программе.

destinations: []

# Уведомления в Telegram при записи клиента в календаре.
# После сборки/установки откройте config.yaml рядом с SheetsHub.exe и замените заглушки:
# 1) @BotFather → токен бота
# 2) Напишите боту сообщение
# 3) https://api.telegram.org/bot<TOKEN>/getUpdates → chat.id
# Затем поставьте enabled: true (или включите в окне Таблицы).
telegram:
  enabled: false
  bot_token: "PASTE_BOT_TOKEN_HERE"
  chat_id: "PASTE_CHAT_ID_HERE"

# Кнопка «Таблицы» скрыта — открыть окно: Ctrl+Shift+T
# (пароль не нужен; при желании задайте tables_password)
ui:
  show_tables_button: false
  tables_password: ""
