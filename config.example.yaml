# Скопируйте файл как config.yaml и подставьте свои таблицы.
# ID таблицы — кусок ссылки между /d/ и /edit:
# https://docs.google.com/spreadsheets/d/ВОТ_ЭТОТ_ID/edit
#
# Одна ссылка = и чтение, и запись в ту же таблицу.
# sources и destinations в файле совпадают (программа пишет оба блока сама).
# service / address — необязательно: подпись врача и адрес.
# sheet: имя вкладки внизу Google Таблицы. Один лист = одна таблица в программе.
#   sheet: АВГУСТ 2026
#   sheet: все   — больше не грузит все вкладки; берётся текущий месяц или первый лист
# kind: info — отдельная справочная таблица (не календарь)
#
# registry — одна общая Google-таблица со списком всех календарей.
# Её нужно открыть для сервисного аккаунта (Редактор). Тогда список таблиц
# синхронизируется между всеми компьютерами (каждые 30 с и при сохранении).

credentials: credentials.json

registry:
  spreadsheet_id: PASTE_REGISTRY_SPREADSHEET_ID_OR_URL
  sheet: SheetsHub

sources:
  - name: Гинеколог
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: все
    # service: Гинеколог
    # address: пр-т Партизанский, 56

  - name: Справка клиники
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: Информация
    kind: info

destinations:
  - name: Гинеколог
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: все

  - name: Справка клиники
    spreadsheet_id: PASTE_SPREADSHEET_ID_OR_URL
    sheet: Информация
    kind: info
