name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build SheetsHub.exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SheetsHub --collect-all customtkinter --collect-all certifi --collect-all gspread --collect-all truststore --hidden-import=certifi --hidden-import=truststore --add-data "config.example.yaml;." launcher.py
          if not exist dist\SheetsHub mkdir dist\SheetsHub
          copy /Y config.example.yaml dist\SheetsHub\
          if exist credentials.example.json copy /Y credentials.example.json dist\SheetsHub\
          for /f "delims=" %%i in ('python -c "import certifi; print(certifi.where())"') do copy /Y "%%i" dist\SheetsHub\cacert.pem

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SheetsHub-Windows
          path: dist/SheetsHub/
          if-no-files-found: error
