name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write service account credentials for bundle
        env:
          SHEETS_HUB_CREDENTIALS_JSON: ${{ secrets.SHEETS_HUB_CREDENTIALS_JSON }}
          SHEETS_HUB_OAUTH_JSON: ${{ secrets.SHEETS_HUB_OAUTH_JSON }}
        shell: bash
        run: |
          JSON_BODY="${SHEETS_HUB_CREDENTIALS_JSON:-$SHEETS_HUB_OAUTH_JSON}"
          mkdir -p packaging
          if [ -z "$JSON_BODY" ]; then
            echo "::warning::Секрет SHEETS_HUB_CREDENTIALS_JSON не задан — credentials.json не попадёт в архив. Положите SA JSON рядом с exe вручную."
            exit 0
          fi
          printf '%s\n' "$JSON_BODY" > packaging/bundled_credentials.json
          python -c "import json; d=json.load(open('packaging/bundled_credentials.json', encoding='utf-8')); assert d.get('type')=='service_account' and d.get('client_email'), 'нужен service_account JSON'; print('SA JSON OK:', d['client_email'])"

      - name: Build SheetsHub.exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SheetsHub --noupx --collect-all customtkinter --collect-all certifi --collect-all gspread --collect-all truststore --collect-all google_auth_oauthlib --hidden-import=certifi --hidden-import=truststore --hidden-import=google_auth_oauthlib --hidden-import=google_auth_oauthlib.flow --add-data "config.example.yaml;." launcher.py
          if not exist dist\SheetsHub\_internal (
            echo Missing _internal folder after build
            exit /b 1
          )
          copy /Y config.example.yaml dist\SheetsHub\
          if exist credentials.example.json copy /Y credentials.example.json dist\SheetsHub\
          if exist packaging\bundled_credentials.json copy /Y packaging\bundled_credentials.json dist\SheetsHub\credentials.json
          if exist packaging\HOW_TO_RUN.txt copy /Y packaging\HOW_TO_RUN.txt dist\SheetsHub\
          if exist packaging\start_SheetsHub.bat copy /Y packaging\start_SheetsHub.bat dist\SheetsHub\
          for /f "delims=" %%i in ('python -c "import certifi; print(certifi.where())"') do copy /Y "%%i" dist\SheetsHub\cacert.pem
          if exist dist\SheetsHub\credentials.json (
            echo Bundled credentials.json OK
          ) else (
            echo No credentials.json in bundle — place service account JSON next to exe
          )

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SheetsHub-Windows
          path: dist/SheetsHub/
          if-no-files-found: error
          compression-level: 0
