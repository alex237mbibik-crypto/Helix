name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Write OAuth credentials for bundle
        env:
          SHEETS_HUB_OAUTH_JSON: ${{ secrets.SHEETS_HUB_OAUTH_JSON }}
        shell: bash
        run: |
          if [ -z "$SHEETS_HUB_OAUTH_JSON" ]; then
            echo "::error::Добавьте GitHub Secret SHEETS_HUB_OAUTH_JSON (содержимое credentials.json)"
            exit 1
          fi
          mkdir -p packaging
          printf '%s\n' "$SHEETS_HUB_OAUTH_JSON" > packaging/bundled_credentials.json
          python -c "import json; json.load(open('packaging/bundled_credentials.json', encoding='utf-8')); print('OAuth JSON OK')"

      - name: Build SheetsHub.exe
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SheetsHub --noupx --collect-all customtkinter --collect-all certifi --collect-all gspread --collect-all truststore --collect-all google_auth_oauthlib --hidden-import=certifi --hidden-import=truststore --hidden-import=google_auth_oauthlib --hidden-import=google_auth_oauthlib.flow --add-data "config.example.yaml;." launcher.py
          if not exist dist\SheetsHub\_internal (
            echo Missing _internal folder after build
            exit /b 1
          )
          copy /Y config.example.yaml dist\SheetsHub\
          if exist credentials.example.json copy /Y credentials.example.json dist\SheetsHub\
          if exist packaging\bundled_credentials.json copy /Y packaging\bundled_credentials.json dist\SheetsHub\credentials.json
          if exist packaging\HOW_TO_RUN.txt copy /Y packaging\HOW_TO_RUN.txt dist\SheetsHub\
          if exist packaging\start_SheetsHub.bat copy /Y packaging\start_SheetsHub.bat dist\SheetsHub\
          for /f "delims=" %%i in ('python -c "import certifi; print(certifi.where())"') do copy /Y "%%i" dist\SheetsHub\cacert.pem
          if not exist dist\SheetsHub\credentials.json (
            echo credentials.json was not bundled
            exit /b 1
          )
          echo Bundled credentials.json OK

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SheetsHub-Windows
          path: dist/SheetsHub/
          if-no-files-found: error
          compression-level: 0
